name: Live API check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          CBE2JSON_CLIENT_ID: ${{ secrets.CBE2JSON_CLIENT_ID }}
          CBE2JSON_SECRET_KEY: ${{ secrets.CBE2JSON_SECRET_KEY }}
          CBE2JSON_BASE_URL: https://api.dev.cbe2json.be
