version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TS 6 breaks tsup's dts build.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # vitest 5 drops Node 20, which this package still supports.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      # Types stay on the oldest supported Node.js, so the typecheck rejects
      # APIs that Node 20 lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
